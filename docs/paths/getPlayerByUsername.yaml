operationId: getPlayerByUsername
summary: Get Player by Username
security: []
parameters:
  - name: username
    in: path
    required: true
    schema:
      type: string
responses:
  "200":
    description: OK
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: boolean
              default: false
            data:
              $ref: ../components/schemas/Player.yaml
