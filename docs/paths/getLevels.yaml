operationId: getLevels
summary: Get Levels
security: []
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: number
      minimum: 1
      default: 1
  - name: limit
    in: query
    required: false
    schema:
      type: number
      minimum: 0
      default: 10
responses:
  "200":
    description: OK
    content:
      application/json:
        schema:
          type: object
          properties:
            error:
              type: boolean
              default: false
            count:
              type: number
            data:
              type: array
              items:
                allOf:
                  - $ref: ../components/schemas/Level.yaml
                  - type: object
                    properties:
                      top_record:
                        $ref: ../components/schemas/LevelRecord.yaml
                        description: The fastest submitted record.

